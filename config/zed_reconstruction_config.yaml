zed2i_reconstruction_acquisition:
  ros__parameters:
    experiment_name: "reconstruction_experiment"
    base_output_dir: "/home/werikson/Dev/ros2_zed_ws/data/mcaps/lab_room_01"
    storage_id: "mcap"

    # ZED configuration
    frame_rate: 5
    depth_min: 0.3
    depth_max: 20.0
    altitude_m: 1.5

    # Topics
    point_cloud_topic: "/zed/zed_node/point_cloud/cloud_registered"
    left_image_topic: "/zed/zed_node/left/image_rect_color"
    right_image_topic: "/zed/zed_node/right/image_rect_color"

    # Extra topics to be recorded in rosbag
    extra_topics:
      - "/tf"
      - "/tf_static"
      - "/zed/zed_node/imu/data"
      - "/zed/zed_node/left/camera_info"
      - "/zed/zed_node/right/camera_info"
      - "/zed/zed_node/odom"
      - "/zed/zed_node/pose_with_covariance"
      - "/zed/zed_node/path_map"
      - "/zed/zed_node/path_odom"
      - "/zed/zed_node/depth/camera_info"
      - "/zed/zed_node/depth/depth_info"
      - "/zed/zed_node/depth/depth_registered"
      - "/zed/zed_node/pose"
      - "/diagnostics"
